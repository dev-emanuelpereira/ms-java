spring:
  application:
    name: eurekaserver

  profiles:
    active: dev

  security:
    basic:
      enabled: true

logging:
  pattern:
    console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n'

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false


