spring:
  profiles:
    active: dev

  application:
    name: msclientes

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://eureka-user:aismdoiam12@localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoint:
    web:
      exposure:
        include: '*'

logging:
  file:
    name: ./logs/log-file.log


